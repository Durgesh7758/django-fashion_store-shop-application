<style>
/* Wrapper to center form */
.forgot-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center; /* horizontal center */
    align-items: center;     /* vertical center */
    background-color: #f8f8f8;
    padding: 20px;
}

/* Container styling */
.forgot-container {
    width: 400px;
    padding: 30px 25px;
    background-color: #ffffff; /* white like login */
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    font-family: 'Arial', sans-serif;
}

.forgot-container h2 {
    text-align: center;
    color: #222; /* same as login heading */
    margin-bottom: 25px;
    font-size: 1.8rem;
}

.forgot-container form {
    display: flex;
    flex-direction: column;
}

.forgot-container input[type="email"],
.forgot-container input[type="text"],
.forgot-container input[type="password"] {
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    transition: 0.3s;
}

.forgot-container input:focus {
    border-color: #6a5acd; /* bootstrap primary blue */
    box-shadow: 0 0 6px rgba(13,110,253,0.3);
    outline: none;
}

.forgot-container button {
    padding: 12px;
    background-color: #6a5acd; /* bootstrap primary blue */
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

.forgot-container button:hover {
    background-color: #5848c2; /* darker blue on hover */
}

.forgot-container p {
    font-size: 0.9rem;
    color: #555;
    text-align: center;
    margin-top: 12px;
}

@media (max-width: 576px) {
    .forgot-container {
        width: 100%;
        margin: 0 10px;
        padding: 25px 20px;
    }

    .forgot-container h2 {
        font-size: 1.5rem;
    }
}
</style>

<div class="forgot-wrapper">
    <div class="forgot-container">
        <h2>Forgot Password?</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send Reset Link</button>
        </form>

        <p>Check your email for the reset link after submitting.</p>
    </div>
</div>
