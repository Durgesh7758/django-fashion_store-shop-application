{% extends 'shop/basic.html' %}
{% block title %}Payment{% endblock %}

{% block body %}
<div class="container my-4">
  <h2>Payment</h2>

  <div class="card p-3 mb-3">
    <h5>Order Summary</h5>
    <p>Total: <strong>₹{{ total_amount }}</strong></p>
    {% if billing_address %}
    <p><strong>Billing Address:</strong><br>{{ billing_address|linebreaksbr }}</p>
    {% endif %}
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-check">
      <input class="form-check-input" type="radio" name="payment_method" id="cod" value="COD" checked>
      <label class="form-check-label" for="cod">Cash on Delivery (COD)</label>
    </div>

    <div class="form-check mt-2">
      <input class="form-check-input" type="radio" name="payment_method" id="online" value="Online">
      <label class="form-check-label" for="online">Pay Online (Simulated)</label>
    </div>

    <div class="mt-3">
      <label>Billing address (optional)</label>
      <textarea name="billing_address" class="form-control" placeholder="If different from delivery address">{{ billing_address }}</textarea>
    </div>

    <button type="submit" class="btn btn-success mt-3 w-100">Pay Now</button>
  </form>
</div>
{% endblock %}
